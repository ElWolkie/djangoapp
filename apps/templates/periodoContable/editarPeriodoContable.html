{% block stylesheets %}
<link rel="stylesheet" href="/static/assets/css/styleForms.css" />
<link rel="stylesheet" href="/static/assets/css/argon.css" />
{% endblock stylesheets %}

{% block content %}
<div class="mt-5">
  <h2 class="text-center text-dark">Modificar Periodo Contable</h2>

  <!-- Contenedor para los mensajes -->
  <div id="formMessages"></div>

  <form method="POST" class="mt-3 text-dark needs-validation" autocomplete="off" style="max-width: 600px; margin: 0 auto;" id="periodoContableForm" action="{% url 'periodo_contable_edit'  periodo.idPeriodo %}" novalidate>
    {% csrf_token %}

    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="nombrePeriodo">Nombre:</label>
        <input type="text" id="nombrePeriodo" name="nombrePeriodo" class="form-control text-dark" value="{{ periodo.nombrePeriodo }}" placeholder="Ingrese el nombre del periodo" maxlength="255" required />
      </div>
      <div class="form-group col-md-6">
        <label for="fechaInicioPeriodo">Fecha de Inicio:</label>
        <input type="date" id="fechaInicioPeriodo" name="fechaInicioPeriodo" class="form-control text-dark" value="{{ periodo.fechaInicioPeriodo|date:'Y-m-d' }}" required />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="fechaFinPeriodo">Fecha de Fin:</label>
        <input type="date" id="fechaFinPeriodo" name="fechaFinPeriodo" class="form-control text-dark" value="{{ periodo.fechaFinPeriodo|date:'Y-m-d'  }}" required />
      </div>

      <div class="form-group col-md-6">
        <input type="hidden" id="estadoPlanCuenta" name="estadoPlanCuenta" value="True" />
      </div>
    </div>

    <div class="text-center">
      <input type="submit" class="btn btn-warning mt-4" value="Guardar" />
    </div>
  </form>
</div>

<script>
      function activarMayusculasInputs() {
      document.addEventListener('input', function(e) {
        if (e.target.tagName === 'INPUT' && !e.target.type.match(/password|hidden|email/)) {
          e.target.value = e.target.value.toUpperCase();
        }
      });
    }
    activarMayusculasInputs();
    
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.getElementById('periodoContableForm');
      const inputs = form.querySelectorAll('input');
  
      // Validar campos al enviar el formulario
      form.addEventListener('submit', function (event) {
        let isValid = true;
  
        inputs.forEach(function (input) {
          if (!input.checkValidity()) {
            input.classList.add('is-invalid');
            input.classList.remove('is-valid');
            isValid = false;
          } else {
            input.classList.add('is-valid');
            input.classList.remove('is-invalid');
          }
        });
  
        if (!isValid) {
          event.preventDefault();
          event.stopPropagation();
        }
  
        form.classList.add('was-validated');
      });
  
      // Validar campos en tiempo real
      inputs.forEach(function (input) {
        input.addEventListener('input', function () {
          if (input.checkValidity()) {
            input.classList.add('is-valid');
            input.classList.remove('is-invalid');
          } else {
            input.classList.add('is-invalid');
            input.classList.remove('is-valid');
          }
        });
      });
    });
  
    // Interceptar el envío del formulario de registro con AJAX
    $(document).off('submit', '#periodoContableForm').on('submit', '#periodoContableForm', function (e) {
      e.preventDefault();
      var form = $(this);
      var messagesContainer = $('#formMessages');
      messagesContainer.empty();
  
      if (!form[0].checkValidity()) {
        form.addClass('was-validated');
        return;
      }
  
      $.ajax({
        url: form.attr('action'),
        method: form.attr('method'),
        data: form.serialize(),
        success: function (response) {
          if (response.success) {
            Swal.fire({
              title: 'Éxito',
              text: response.message,
              icon: 'success',
              confirmButtonText: 'OK',
              customClass: { confirmButton: 'btn btn-warning' },
              buttonsStyling: false,
            }).then(() => {
              location.reload();
            });
          } else {
            // Mostrar errores
            if (response.errors) {
              $.each(response.errors, function (field, error) {
                messagesContainer.append('<div class="alert alert-danger">' + error + '</div>');
              });
            }
          }
        },
        error: function (error) {
          console.log(error);
        }
      });
    });
  </script>
{% endblock content %}
