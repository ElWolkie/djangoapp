

{% block stylesheets %}
<link rel="stylesheet" href="/static/assets/css/styleForms.css" />
<link rel="stylesheet" href="/static/assets/css/argon.css" />
{% endblock stylesheets %}

{% block content %}
<div class="container mt-5">
  <h2 class="text-center text-dark" style="margin: 0 auto; padding: 5px 0 15px;">Editar Persona</h2>
  
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
  
  <form method="POST" class="mt-4 text-dark" autocomplete="off" style="font-weight: bold;" id="editPersonaForm" action="{% url 'edit_persona' persona.idPersona %}">
    {% csrf_token %}
    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <label for="tipoPersona">Tipo de Persona:</label>
          <div class="row">
        <div class="col-md-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="tipoPersona" id="tipoUsuario" value="1">
            <label class="form-check-label" for="tipoUsuario">Usuario</label>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="tipoPersona" id="tipoCliente" value="2">
            <label class="form-check-label" for="tipoCliente">Cliente</label>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="tipoPersona" id="tipoProveedor" value="3">
            <label class="form-check-label" for="tipoProveedor">Proveedor</label>
          </div>
        </div>
          </div>
        </div>
        <div class="form-group">
          <label for="nombres">Nombres:</label>
          <div class="input-group">
          <input type="text" id="nombres" name="nombres" class="form-control text-dark" value="{{persona.nombres}}" placeholder="Ingrese su nombre" tabindex="3" maxlength="100" required />
        </div>
        </div>
        <div class="form-group">
          <label for="telefono">Teléfono:</label>
          <input type="text" id="telefono" name="telefono" class="form-control text-dark" value="{{persona.telefono}}" placeholder="0412-000-0000" tabindex="5" maxlength="15" required />
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label for="cedula">Cédula:</label>
          <input type="text" id="cedula" name="cedula" class="form-control text-dark" value="{{persona.cedula}}" placeholder="Ingrese su cédula" tabindex="2" maxlength="8" required />
        </div>
        <div class="form-group">
          <label for="apellidos">Apellidos:</label>
          <input type="text" id="apellidos" name="apellidos" class="form-control text-dark" value="{{persona.apellidos}}" placeholder="Ingrese su apellido" tabindex="4" maxlength="100" required />

        </div>
        <div class="form-group">
          <label for="correo">Correo Electrónico:</label>
          <input type="email" id="correo" name="correo" class="form-control text-dark" value="{{persona.correo}}" placeholder="example@gmail.com" tabindex="6" maxlength="254" required />
          <input type="hidden" id="estadoPersona" name="estadoPersona" class="form-control text-dark" value="ACTIVO" />
        </div>
      </div>
    </div>
    <div class="text-center">
      <input type="submit" class="btn btn-warning mt-4" value="Guardar" />
    </div>
  </form>
</div>
<!-- Modal -->
<div class="modal fade" id="editPersonaModal" tabindex="-1" role="dialog" aria-labelledby="editPersonaModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editPersonaModalLabel">Registro de Persona</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <!-- Contenedor para los mensajes -->
        <div id="modalMessages"></div>
        <!-- El contenido del formulario se cargará aquí -->
      </div>
    </div>
  </div>
</div>
{% endblock content %}

{% block javascripts %}
<script src="/static/assets/js/validacionesPersona.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Obtener el parámetro 'idTP' de la URL
    const params = new URLSearchParams(window.location.search);
    const idTP = params.get("idTP");

    if (idTP) {
      // Buscar el checkbox correspondiente y marcarlo
      const checkbox = document.querySelector(`input[name="tipoPersona"][value="${idTP}"]`);
      if (checkbox) {
        checkbox.checked = true;
      }
    }
  });
</script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    $('#editTipoPersonaModal').on('show.bs.modal', function (e) {
      var modal = $(this);
      $.ajax({
        url: 'url',
        method: 'GET',
        success: function(data) {
          modal.find('.modal-body').html(data);
        }
      });
    });

  });
</script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Obtener el parámetro 'idTP' de la URL
    const params = new URLSearchParams(window.location.search);
    const idTP = params.get("idTP");

    if (idTP) {
      // Buscar el checkbox correspondiente y marcarlo
      const checkbox = document.querySelector(`input[name="tipoPersona"][value="${idTP}"]`);
      if (checkbox) {
        checkbox.checked = true;
      }
    }
  });
</script>

{% endblock javascripts %}
