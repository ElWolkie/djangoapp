{% block stylesheets %}
<link rel="stylesheet" href="/static/assets/css/styleForms.css" />
<link rel="stylesheet" href="/static/assets/css/argon.css" />
{% endblock stylesheets %}

{% block content %}
<div class="container mt-5">
  <h2 class="text-center text-dark">Registrar Cuenta Bancaria</h2>

  <!-- Contenedor para los mensajes -->
  <div id="formMessages"></div>

  <form method="POST" class="mt-3 text-dark needs-validation" autocomplete="off" style="max-width: 600px; margin: 0 auto;" id="cuentaBancoForm" action="{% url 'cuentaBanco_create' %}" novalidate>
    {% csrf_token %}

    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="idBanco">Banco:</label>
        <select id="idBanco" name="idBanco" class="form-control text-dark" required>
          <option value="" disabled selected>Seleccione un banco</option>
          {% for banco in bancos %}
          <option value="{{ banco.id }}">{{ banco.nombreBanco }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group col-md-6">
        <label for="idPlanCuenta">Plan de Cuenta:</label>
        <input type="number" id="idPlanCuenta" name="idPlanCuenta" class="form-control text-dark" placeholder="Ingrese el ID del plan de cuenta" required />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="numeroCuentaBanco">Número de Cuenta:</label>
        <input type="text" id="numeroCuentaBanco" name="numeroCuentaBanco" class="form-control text-dark" placeholder="Ingrese el número de cuenta" maxlength="20" required />
      </div>

      <div class="form-group col-md-6">
        <label for="tipoCuentaBanco">Tipo de Cuenta:</label>
        <input type="text" id="tipoCuentaBanco" name="tipoCuentaBanco" class="form-control text-dark" placeholder="Ingrese el tipo de cuenta" maxlength="50" required />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="idMoneda">Moneda:</label>
        <input type="number" id="idMoneda" name="idMoneda" class="form-control text-dark" placeholder="Ingrese el ID de la moneda" required />
      </div>

      <div class="form-group col-md-6">
        <label for="fechaApertura">Fecha de Apertura:</label>
        <input type="date" id="fechaApertura" name="fechaApertura" class="form-control text-dark" required />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="saldoDisponible">Saldo Disponible:</label>
        <input type="number" step="0.01" id="saldoDisponible" name="saldoDisponible" class="form-control text-dark" placeholder="Ingrese el saldo disponible" required />
      </div>
    </div>

    <div class="text-center">
      <input type="submit" class="btn btn-warning mt-4" value="Guardar" />
    </div>
  </form>
</div>
{% endblock content %}

{% block javascripts %}
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('cuentaBancoForm');
    const inputs = form.querySelectorAll('input, select');

    // Validar campos al enviar el formulario
    form.addEventListener('submit', function (event) {
      let isValid = true;

      inputs.forEach(function (input) {
        if (!input.checkValidity()) {
          isValid = false;
          input.classList.add('is-invalid');
        } else {
          input.classList.remove('is-invalid');
        }
      });

      if (!isValid) {
        event.preventDefault();
        event.stopPropagation();
      }

      form.classList.add('was-validated');
    });

    // Validar campos en tiempo real
    inputs.forEach(function (input) {
      input.addEventListener('input', function () {
        if (input.checkValidity()) {
          input.classList.remove('is-invalid');
          input.classList.add('is-valid');
        } else {
          input.classList.remove('is-valid');
          input.classList.add('is-invalid');
        }
      });
    });
  });
</script>
{% endblock javascripts %}
