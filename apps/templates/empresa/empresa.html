{% block stylesheets %}
<link rel="stylesheet" href="/static/assets/css/styleForms.css" />
<link rel="stylesheet" href="/static/assets/css/argon.css" />
{% endblock stylesheets %}

{% block content %}
<div class="mt-5">
  <h2 class="text-center text-dark">Registrar Empresa</h2>

  <!-- Contenedor para los mensajes -->
  <div id="formMessages"></div>

  <form method="POST" class="mt-3 text-dark needs-validation" autocomplete="off" style="max-width: 600px; margin: 0 auto;" id="empresaForm" action="{% url 'empresa_create' %}" novalidate>
    {% csrf_token %}

    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="nombreEmpresa">Nombre:</label>
        <input type="text" id="nombreEmpresa" name="nombreEmpresa" class="form-control text-dark" placeholder="Ingrese el nombre de la empresa" maxlength="255" required />
      </div>

      <div class="form-group col-md-6">
        <label for="rifEmpresa">RIF:</label>
        <input type="text" id="rifEmpresa" name="rifEmpresa" class="form-control text-dark" placeholder="Ingrese el RIF de la empresa" maxlength="20" required />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="telefonoEmpresa">Teléfono:</label>
        <input type="text" id="telefonoEmpresa" name="telefonoEmpresa" class="form-control text-dark" placeholder="Ingrese el teléfono de la empresa" maxlength="15" required />
      </div>

      <div class="form-group col-md-6">
        <label for="correoEmpresa">Correo:</label>
        <input type="email" id="correoEmpresa" name="correoEmpresa" class="form-control text-dark" placeholder="Ingrese el correo de la empresa" required />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group col-md-12">
        <label for="direccionEmpresa">Dirección:</label>
        <textarea id="direccionEmpresa" name="direccionEmpresa" class="form-control text-dark" placeholder="Ingrese la dirección de la empresa" rows="3" required></textarea>
      </div>
    </div>

    <div class="text-center">
      <input type="submit" class="btn btn-warning mt-4" value="Guardar" />
    </div>
  </form>
</div>
{% endblock content %}

{% block javascripts %}
<script>
  function activarMayusculasInputs() {
      document.addEventListener('input', function(e) {
        if (e.target.tagName === 'INPUT' && !e.target.type.match(/password|hidden|email/)) {
          e.target.value = e.target.value.toUpperCase();
        }
      });
    }
    activarMayusculasInputs();
  document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('empresaForm');
    const inputs = form.querySelectorAll('input, textarea');

    // Validar campos al enviar el formulario
    form.addEventListener('submit', function (event) {
      let isValid = true;

      inputs.forEach(function (input) {
        if (!input.checkValidity()) {
          isValid = false;
          input.classList.add('is-invalid');
        } else {
          input.classList.remove('is-invalid');
        }
      });

      if (!isValid) {
        event.preventDefault();
        event.stopPropagation();
      }

      form.classList.add('was-validated');
    });

    // Validar campos en tiempo real
    inputs.forEach(function (input) {
      input.addEventListener('input', function () {
        if (input.checkValidity()) {
          input.classList.remove('is-invalid');
          input.classList.add('is-valid');
        } else {
          input.classList.remove('is-valid');
          input.classList.add('is-invalid');
        }
      });
    });
  });

  // Interceptar el envío del formulario de registro con AJAX
  $(document).off('submit', '#empresaForm').on('submit', '#empresaForm', function (e) {
    e.preventDefault();
    var form = $(this);
    var messagesContainer = $('#formMessages');
    messagesContainer.empty();

    if (!form[0].checkValidity()) {
      form.addClass('was-validated');
      return;
    }

    $.ajax({
      url: form.attr('action'),
      method: form.attr('method'),
      data: form.serialize(),
      success: function (response) {
        if (response.success) {
          Swal.fire('Éxito', response.message, 'success').then(() => {
            location.reload(); // Recargar la página para reflejar los cambios
          });
        } else {
          if (response.errors) {
            for (var field in response.errors) {
              messagesContainer.append('<div class="alert alert-danger">' + response.errors[field] + '</div>');
            }
          } else {
            Swal.fire('Error', response.message, 'error');
          }
        }
      },
      error: function () {
        Swal.fire('Error', 'No se pudo procesar la solicitud.', 'error');
      }
    });
  });
</script>
{% endblock javascripts %}
