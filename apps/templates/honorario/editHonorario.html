{% load static %}

{% block stylesheets %}
<link rel="stylesheet" href="/static/assets/css/styleForms.css" />
<link rel="stylesheet" href="/static/assets/css/argon.css" />
{% endblock stylesheets %}
{% block content %}
{% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
<div class=" mt-5">
  <h2 class="text-center text-dark" style="margin: 0 auto; padding: 5px 0 15px;">Actualizar Honorario</h2>
  <form method="POST" class="mt-3 text-dark" autocomplete="off" style="font-weight: bold; max-width: 600px; margin: 0 auto;" id="editHonorarioForm" action="{% url 'edit_honorario' honorario.idHonorario %}">  
    {% csrf_token %}  
    
    <div class="form-row">  
      <div class="form-group col-md-6">  
        <label for="cedulaPersona">Cédula del Proveedor:</label>  
        <div class="input-group"> <!-- Usar input-group para alinear botón y select -->  
            <input type="text" id="cedulaPersona" name="cedulaPersona" class="form-control text-dark" tabindex="1" required oninput="checkPersona()" value="{{ honorario.idPersona.cedula }}"
                 disabled>
            <div class="input-group-append">
                <span id="check-icon" class="input-group-text"></span>
            </div>
            <input type="hidden" id="idPersona" name="idPersona" value="{{ honorario.idPersona.idPersona }}" />
        </div>  
      </div>
      <div class="form-group col-md-6">  
        <label for="idCargo">Cargo:</label>  
        <div class="input-group"> <!-- Usar input-group para alinear botón y select -->  
          <select id="idCargo" name="idCargo" class="form-control text-dark" tabindex="1" required>  
            <option value="" disabled selected>Seleccione..</option>  
           {% for cargo in cargos %}
            <option value="{{ cargo.idCargo }}"
                    {% if cargo.idCargo == honorario.idCargo.idCargo %}selected{% endif %}>
              {{ cargo.nombreCargo }}
            </option>
          {% endfor %}
          </select>  
        </div>  
      </div>  
      
      <div class="form-group col-md-6">  
        <label for="idMateria">Materia:</label>  
        <div class="input-group"> <!-- Usar input-group para alinear botón y select -->  
          <select id="idMateria" name="idMateria" class="form-control text-dark" tabindex="1" required>  
            <option value="" disabled selected>Seleccione..</option>  
            {% for materia in materias %}
            <option value="{{ materia.idMateria }}"
                    {% if materia.idMateria == honorario.idMateria.idMateria %}selected{% endif %}>
              {{ materia.nombreMateria }}
            </option>
          {% endfor %}
          </select>  
        </div>  
      </div>  

      <div class="form-group col-md-6">  
        <label for="nombreCohorte">Cohorte:</label>  
        <div class="input-group"> <!-- Usar input-group para alinear botón y select -->  
          <input type="text" id="nombreCohorte" name="nombreCohorte" class="form-control text-dark" tabindex="1" required oninput="checkCohorte()" value="{{ honorario.idCohorte.nombreCohorte }}"
                 disabled>
          <div class="input-group-append">
              <span id="check-cohorte-icon" class="input-group-text"></span>
          </div>
          <input type="hidden" id="idCohorte" name="idCohorte" value="{{ honorario.idCohorte.idCohorte }}"/>
        </div>  
      </div>  
      <div class="form-group col-md-6">  
        <label for="horas">Horas:</label>  
        <input type="text" id="horas" name="horas" class="form-control text-dark" placeholder="Ingrese las horas (HH:mm)" tabindex="3" required value="{{ honorario.horas }}"/>  
      </div>  
    </div>  
      <div id="alert-container"></div> <!-- Contenedor para las alertas -->

      <!-- Estado oculto -->
      <input type="hidden" name="estadoHonorario" value="{{ honorario.estadoHonorario }}">

    <div class="text-center">  
      <input type="submit" class="btn btn-warning mt-4" value="Guardar" />  
    </div>  
  </form>
{% endblock content %}

{% block javascripts %}
<script>
// validación solo dígitos y dos puntos para horas
document.getElementById("horas").addEventListener("input", function() {
  this.value = this.value.replace(/[^0-9:]/g, "").slice(0,5);
});

// AJAX submit (igual que antes)
$(document).on("submit", "#editHonorarioForm", function(e){
  e.preventDefault();
  const $f = $(this);
  const $btn = $f.find('button[type="submit"]').prop('disabled',true);

  if (!$f[0].checkValidity()){
    $f.addClass('was-validated');
    $btn.prop('disabled',false);
    return;
  }

  $.post($f.attr("action"), $f.serialize())
    .done(resp => {
      if (resp.success) {
        // cerrar modal y recargar
        $('#editHonorarioModal').modal('hide');
        setTimeout(()=>location.reload(),500);
      } else {
        let html="";
        Object.values(resp.errors).forEach(msg=>{
          html+=`<div class="alert alert-danger">${msg}</div>`;
        });
        $("#alert-container").html(html);
      }
    })
    .fail(()=>{
      $("#alert-container").html('<div class="alert alert-danger">Error en el servidor.</div>');
    })
    .always(()=>{
      $btn.prop('disabled',false);
    });
});
</script>
{% endblock javascripts %}
