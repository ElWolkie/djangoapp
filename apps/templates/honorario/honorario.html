{% load static %}
{% block stylesheets %}
<link rel="stylesheet" href="{% static 'assets/css/sidenav.css' %}" />
{% endblock stylesheets %}

{% block content %}
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
  {% endif %}

  <div class="mt-5">
    <h2 class="text-center text-dark" style="padding:5px 0 15px;">Registrar Honorario</h2>
    <form id="honorarioForm"
          method="POST"
          action="{% url 'honorario_modal' %}"
          class="mt-3 text-dark"
          autocomplete="off"
          style="font-weight:bold;max-width:600px;margin:0 auto;">
      {% csrf_token %}

      <div class="row g-3">
        <!-- Cédula + búsqueda personalizada -->
        <div class="col-md-6">
          <label for="cedulaPersona" class="form-label">Cédula del Proveedor:</label>
          <div class="input-group">
            <input type="text"
                   id="cedulaPersona"
                   name="cedulaPersona"
                   class="form-control"
                   required
                   placeholder="Ingrese cédula…"
                   oninput="checkPersona()">
            <span id="check-icon" class="input-group-text"></span>
            <input type="hidden" id="idPersona" name="idPersona">
          </div>
        </div>

        <!-- Cargo -->
      <div class="form-group col-md-6">  
        <label for="idCargo">Cargo:</label>  
        <div class="input-group"> <!-- Usar input-group para alinear botón y select -->  
          <select id="idCargo" name="idCargo" class="form-control text-dark" tabindex="1" required>  
            <option value="" disabled selected>Seleccione..</option>  
           {% for cargo in cargos %}  
              <option value="{{ cargo.idCargo }}">{{ cargo.nombreCargo }}</option>
            {% endfor %}
          </select>  
        </div>  
      </div>

        <!-- Materia -->
      <div class="form-group col-md-6">  
        <label for="idMateria">Materia:</label>  
        <div class="input-group"> <!-- Usar input-group para alinear botón y select -->  
          <select id="idMateria" name="idMateria" class="form-control text-dark" tabindex="1" required>  
            <option value="" disabled selected>Seleccione..</option>  
           {% for materia in materias %}  
              <option value="{{ materia.idMateria }}" class="text-dark">{{ materia.nombreMateria }}</option>  
            {% endfor %}
          </select>  
        </div>  
      </div> 

        <!-- Cohorte + búsqueda -->
        <div class="col-md-6">
          <label for="nombreCohorte" class="form-label">Cohorte:</label>
          <div class="input-group">
            <input type="text"
                   id="nombreCohorte"
                   name="nombreCohorte"
                   class="form-control"
                   required
                   placeholder="Ingrese cohorte…"
                   oninput="checkCohorte()">
            <span id="check-cohorte-icon" class="input-group-text"></span>
            <input type="hidden" id="idCohorte" name="idCohorte">
          </div>
        </div>

        <!-- Horas -->
        <div class="col-md-6">
          <label for="horas" class="form-label">Horas:</label>
          <input type="text"
                 id="horas"
                 name="horas"
                 class="form-control"
                 required
                 placeholder="HH:mm">
        </div>

        <!-- Estado oculto -->
        <input type="hidden" name="estadoHonorario" value="ACTIVO">
      </div>

      <div id="alert-container" class="mt-3"></div>

      <div class="text-center mt-4">
        <button type="submit" class="btn btn-warning">Guardar</button>
      </div>
    </form>
  </div>
{% endblock content %}

{% block javascripts %}
<script>
// Evitamos cargar este fragmento por AJAX; lo abrimos llamando a la vista honorario_modal

// Solo dígito y dos puntos
document.getElementById("horas").addEventListener("input", function() {
  this.value = this.value.replace(/[^0-9:]/g, "").slice(0,5);
});

// Datos del contexto
const cohortes = [
  {% for co in cohortes %}
    { id: "{{ co.idCohorte }}", nombre: "{{ co.nombreCohorte|escapejs }}" },
  {% endfor %}
];
const personas = [
  {% for p in personas %}
    { id: "{{ p.idPersona }}", cedula: "{{ p.cedula }}", nombres: "{{ p.nombres|escapejs }}", apellidos: "{{ p.apellidos|escapejs }}" },
  {% endfor %}
];

// Check persona por cédula
function checkPersona(){
  const val = document.getElementById("cedulaPersona").value;
  const icon = document.getElementById("check-icon");
  const hid  = document.getElementById("idPersona");
  const p = personas.find(x=>x.cedula===val);
  if(p){
    icon.textContent = "✔️"; icon.style.color="green";
    hid.value = p.id;
    showAlert("Persona encontrada: "+p.nombres+" "+p.apellidos,"success");
  } else {
    icon.textContent = "❌"; icon.style.color="red";
    hid.value = "";
    showAlert("Persona no encontrada","danger");
  }
}

// Check cohorte por nombre
function checkCohorte(){
  const val = document.getElementById("nombreCohorte").value;
  const icon = document.getElementById("check-cohorte-icon");
  const hid  = document.getElementById("idCohorte");
  const c = cohortes.find(x=>x.nombre===val);
  if(c){
    icon.textContent = "✔️"; icon.style.color="green";
    hid.value = c.id;
  } else {
    icon.textContent = "❌"; icon.style.color="red";
    hid.value = "";
  }
}

// Muestra alerta interna
function showAlert(msg, type){
  document.getElementById("alert-container").innerHTML = `
    <div class="alert alert-${type} alert-dismissible fade show" role="alert">
      ${msg}
      <button type="button" class="btn btn-sm btn-icon-only text-white" data-bs-dismiss="alert" aria-label="Close" style="position:absolute; top:.75rem; right:.75rem;">
          <i class="fas fa-times"></i>
        </button>
    </div>`;
}

// AJAX submit
$(document).on("submit", "#honorarioForm", function(e){
  e.preventDefault();
  const $f = $(this);
  $.post($f.attr("action"), $f.serialize())
    .done(resp=>{
      if(resp.success){
        showAlert(resp.message,"success");
        $("#honorarioModal").modal("hide");
        setTimeout(()=>location.reload(),500);
      } else {
        const errs = resp.errors;
        let html = "";
        for(let f in errs){
          html += `<div class="alert alert-danger">${errs[f]}</div>`;
        }
        document.getElementById("alert-container").innerHTML = html;
      }
    })
    .fail(()=>showAlert("Error en el servidor","danger"));
});
</script>
{% endblock javascripts %}
