{% block stylesheets %}
<link rel="stylesheet" href="/static/assets/css/styleForms.css" />
<link rel="stylesheet" href="/static/assets/css/argon.css" />
{% endblock stylesheets %}
{% block content %}
{% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
<div class=" mt-5">
  <h2 class="text-center text-dark" style="margin: 0 auto; padding: 5px 0 15px;">Registrar Honorario Académico</h2>
  <form method="POST" class="mt-3 text-dark" autocomplete="off" style="font-weight: bold; max-width: 600px; margin: 0 auto;" id="honorarioForm" action="{% url 'honorario_modal' %}">  
    {% csrf_token %}  
    
    <div class="form-row">  
      <div class="form-group col-md-6">  
        <label for="idContrato">Contrato:</label>  
        <div class="input-group"> <!-- Usar input-group para alinear botón y select -->  
          <select id="idContrato" name="idContrato" class="form-control text-dark" tabindex="1" required>  
            <option value="" disabled selected>Seleccione..</option>  
            {% for contrato in contrato %}  
              <option value="{{ contrato.idContrato }}" class="text-orange">{{ contrato.nombreContrato }}</option>  
            {% endfor %}
          </select>  
        </div>  
      </div>  
      
      <div class="form-group col-md-6">  
        <label for="nombreHonorario">Nombre:</label>  
        <input type="text" id="nombreHonorario" name="nombreHonorario" class="form-control text-dark" placeholder="Ingrese un nombre" tabindex="3" maxlength="100" required />  
        <input type="hidden" id="estadoHonorario" name="estadoHonorario" class="form-control text-dark" value="ACTIVO" />  
      </div>  
    </div>  
    
    <div class="text-center">  
      <input type="submit" class="btn btn-warning mt-4" value="Guardar" />  
    </div>  
  </form>
{% endblock content %}

{% block javascripts %}
{% endblock javascripts %}
