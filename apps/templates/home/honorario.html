{% block stylesheets %}
<link rel="stylesheet" href="/static/assets/css/styleForms.css" />
<link rel="stylesheet" href="/static/assets/css/argon.css" />
{% endblock stylesheets %}
{% block content %}
{% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
<div class=" mt-5">
  <h2 class="text-center text-dark" style="margin: 0 auto; padding: 5px 0 15px;">Registrar Honorario</h2>
  <form method="POST" class="mt-3 text-dark" autocomplete="off" style="font-weight: bold; max-width: 600px; margin: 0 auto;" id="honorarioForm" action="{% url 'honorario_modal' %}">  
    {% csrf_token %}  
    
    <div class="form-row">  
      <div class="form-group col-md-6">  
        <label for="cedulaPersona">Cédula del Proveedor:</label>  
        <div class="input-group"> <!-- Usar input-group para alinear botón y select -->  
            <input type="text" id="cedulaPersona" name="cedulaPersona" class="form-control text-dark" tabindex="1" required oninput="checkPersona()" placeholder="Ingrese cédula...">
            <div class="input-group-append">
                <span id="check-icon" class="input-group-text"></span>
            </div>
            <input type="hidden" id="idPersona" name="idPersona" />
        </div>  
      </div>
      <div class="form-group col-md-6">  
        <label for="idCargo">Cargo:</label>  
        <div class="input-group"> <!-- Usar input-group para alinear botón y select -->  
          <select id="idCargo" name="idCargo" class="form-control text-dark" tabindex="1" required>  
            <option value="" disabled selected>Seleccione..</option>  
           {% for cargo in cargos %}  
              <option value="{{ cargo.idCargo }}" class="text-orange">{{ cargo.nombreCargo }}</option>  
            {% endfor %}
          </select>  
        </div>  
      </div>  
      
      <div class="form-group col-md-6">  
        <label for="idMateria">Materia:</label>  
        <div class="input-group"> <!-- Usar input-group para alinear botón y select -->  
          <select id="idMateria" name="idMateria" class="form-control text-dark" tabindex="1" required>  
            <option value="" disabled selected>Seleccione..</option>  
           {% for materia in materias %}  
              <option value="{{ materia.idMateria }}" class="text-orange">{{ materia.nombreMateria }}</option>  
            {% endfor %}
          </select>  
        </div>  
      </div>  

      <div class="form-group col-md-6">  
        <label for="nombreCohorte">Cohorte:</label>  
        <div class="input-group"> <!-- Usar input-group para alinear botón y select -->  
          <input type="text" id="nombreCohorte" name="nombreCohorte" class="form-control text-dark" tabindex="1" required oninput="checkCohorte()" placeholder="Ingrese nombre de cohorte...">
          <div class="input-group-append">
              <span id="check-cohorte-icon" class="input-group-text"></span>
          </div>
          <input type="hidden" id="idCohorte" name="idCohorte" />
          <input type="hidden" id="estadoContrato" name="estadoContrato" class="form-control text-dark" value="ACTIVO" />
        </div>  
      </div>  
      <div class="form-group col-md-6">  
        <label for="horas">Horas:</label>  
        <input type="text" id="horas" name="horas" class="form-control text-dark" placeholder="Ingrese las horas (HH:mm)" tabindex="3" required pattern="^([0-9]|1[0-9]|2[0-3]):[0-5][0-9]$" title="Ingrese un formato válido de horas (HH:mm)" />  
        <input type="hidden" id="estadoHonorario" name="estadoHonorario" class="form-control text-dark" value="ACTIVO" />  
      </div>  
    </div>  
          <div id="alert-container"></div> <!-- Contenedor para las alertas -->

    <div class="text-center">  
      <input type="submit" class="btn btn-warning mt-4" value="Guardar" />  
    </div>  
  </form>
{% endblock content %}

{% block javascripts %}
<script>
  document.addEventListener("DOMContentLoaded", function() {
    $('c').on('show.bs.modal', function (e) {
      var modal = $(this);
      $.ajax({
        url: 'apps/home/honorario.html',
        method: 'GET',
        success: function(data) {
          modal.find('.modal-body').html(data);
        }
      });
    });
  });
  document.getElementById("horas").addEventListener("input", function() {  
    this.value = this.value.replace(/[^0-9,]/g, '');  

    if (this.value.length > 20) {  
        this.value = this.value.slice(0, 20);  
    }  
});  
  
//Recarga dinamica

$(document).on('submit', '#registroForm', function(e) {
      e.preventDefault();
      var form = $(this);
      $.ajax({
        url: form.attr('action'),
        method: form.attr('method'),
        data: form.serialize(),
        success: function(response) {
          var messagesContainer = $('#modalMessages');
          messagesContainer.empty();
          if (response.success) {
            messagesContainer.append('<div class="alert alert-success alert-dismissible fade show" role="alert">' + response.message + '</div>');
            $('#honorarioModal').modal('hide');
            location.reload();  // Recargar la página para ver los cambios
          } else {
            // Mostrar errores en el modal
            var errors = response.errors;
            for (var field in errors) {
              messagesContainer.append('<div class="alert alert-danger alert-dismissible fade show" role="alert">' + errors[field] + '</div>');
            }
          }
        }
      });
    });
</script>
<script>
 
 const cohortes = [
     {% for cohorte in cohortes %}
         { idCohorte: "{{ cohorte.idCohorte|escapejs }}", nombreCohorte: "{{ cohorte.nombreCohorte|escapejs }}" },
     {% endfor %}
 ];

 const personas = [
 {% for persona in personas %}
     { 
         idPersona: "{{ persona.idPersona|escapejs }}", 
         cedula: "{{ persona.cedula|escapejs }}", 
         nombres: "{{ persona.nombres|escapejs }}", 
         apellidos: "{{ persona.apellidos|escapejs }}" 
     },
 {% endfor %}
];

function checkPersona() {
 const input = document.getElementById('cedulaPersona').value;
 const icon = document.getElementById('check-icon');
 const idPersonaInput = document.getElementById('idPersona');
 const foundPersona = personas.find(persona => persona.cedula === input);

 if (foundPersona) {
     icon.innerHTML = '✔️'; // Pajarito verde
     icon.style.color = 'blue';
     idPersonaInput.value = foundPersona.idPersona;

     // Mostrar alerta con los datos de la persona
     const alertHTML = `
         <div class="alert alert-success alert-dismissible fade show" role="alert">
             <strong style="color: orange; font-size: 1.2em;">Persona encontrada:</strong><br>
             <span style="font-style: italic;">Cédula: ${foundPersona.cedula}</span><br>
             <span style="font-style: italic;">Nombres: ${foundPersona.nombres}</span><br>
             <span style="font-style: italic;">Apellidos: ${foundPersona.apellidos}</span>
             <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                 <span aria-hidden="true">&times;</span>
             </button>
         </div>
     `;

     // Insertar la alerta en el DOM
     document.getElementById('alert-container').innerHTML = alertHTML;
 } else {
     icon.innerHTML = '❌'; // X roja
     icon.style.color = 'red';
     idPersonaInput.value = '';

     // Mostrar alerta de que no se encontró la persona
     const alertHTML = `
         <div class="alert alert-danger alert-dismissible fade show" role="alert">
             <strong>Persona no encontrada</strong>
             <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                 <span aria-hidden="true">&times;</span>
             </button>
         </div>
     `;

     // Insertar la alerta en el DOM
     document.getElementById('alert-container').innerHTML = alertHTML;
 }
}
function checkCohorte() {
        const input = document.getElementById('nombreCohorte').value;
        const icon = document.getElementById('check-cohorte-icon');
        const idCohorteInput = document.getElementById('idCohorte');
        const foundCohorte = cohortes.find(cohorte => cohorte.nombreCohorte === input);
  
        if (foundCohorte) {
            icon.innerHTML = '✔️'; // Pajarito verde
            icon.style.color = 'blue';
            idCohorteInput.value = foundCohorte.idCohorte;
        } else {
            icon.innerHTML = '❌'; // X roja
            icon.style.color = 'red';
            idCohorteInput.value = '';
        }
    }
</script>
{% endblock javascripts %}
