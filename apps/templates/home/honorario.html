{% block stylesheets %}
<link rel="stylesheet" href="/static/assets/css/sidenav.css" />
{% endblock stylesheets %}
{% block content %}
{% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="close" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
      {% endfor %}
  {% endif %}

<div class="mt--5">
  <h2 class="text-center text-dark" style="margin: 0 auto; padding: 5px 0 15px;">Registrar Honorario Académico</h2>
  <form method="POST" class="mt-3 text-dark" autocomplete="off" style="font-weight: bold; max-width: 600px; margin: 0 auto;" id="honorarioForm" action="{% url 'honorario_modal' %}">  
    {% csrf_token %}  
    
    <div class="form-row">  
      <div class="form-group col-md-6">  
        <label for="idContrato">Nº de Contrato:</label>  
        <div class="input-group"> <!-- Usar input-group para alinear botón y select -->  
            <input type="text" id="idContrato" name="idContrato" class="form-control text-dark" tabindex="1" required oninput="checkContrato()" placeholder="245345...">
            <div class="input-group-append">
                <span id="check-icon" class="input-group-text"></span>
            </div>
        </div>  
      </div>
      
      <div class="form-group col-md-6">  
        <label for="horas">Horas:</label>  
        <input type="text" id="horas" name="horas" class="form-control text-dark" placeholder="Ingrese las horas" tabindex="3" maxlength="100" required />  
        <input type="hidden" id="estadoHonorario" name="estadoHonorario" class="form-control text-dark" value="ACTIVO" />  
      </div>  
    </div>  
          <div id="alert-container"></div> <!-- Contenedor para las alertas -->

    <div class="text-center">  
      <input type="submit" class="btn btn-warning mt-4" value="Guardar" />  
    </div>  
  </form>
{% endblock content %}

{% block javascripts %}
<script>
  document.addEventListener("DOMContentLoaded", function() {
    $('c').on('show.bs.modal', function (e) {
      var modal = $(this);
      $.ajax({
        url: 'apps/home/honorario.html',
        method: 'GET',
        success: function(data) {
          modal.find('.modal-body').html(data);
        }
      });
    });
  });
  document.getElementById("horas").addEventListener("input", function() {  
    this.value = this.value.replace(/[^0-9,]/g, '');  

    if (this.value.length > 20) {  
        this.value = this.value.slice(0, 20);  
    }  
});  
  
//Recarga dinamica

$(document).on('submit', '#registroForm', function(e) {
      e.preventDefault();
      var form = $(this);
      $.ajax({
        url: form.attr('action'),
        method: form.attr('method'),
        data: form.serialize(),
        success: function(response) {
          var messagesContainer = $('#modalMessages');
          messagesContainer.empty();
          if (response.success) {
            messagesContainer.append('<div class="alert alert-success alert-dismissible fade show" role="alert">' + response.message + '</div>');
            $('#honorarioModal').modal('hide');
            location.reload();  // Recargar la página para ver los cambios
          } else {
            // Mostrar errores en el modal
            var errors = response.errors;
            for (var field in errors) {
              messagesContainer.append('<div class="alert alert-danger alert-dismissible fade show" role="alert">' + errors[field] + '</div>');
            }
          }
        }
      });
    });
</script>
<script>
  const contratos = [
      {% for contrato in contratos %}
          { 
              idContrato: "{{ contrato.idContrato|escapejs }}", 
              cedula: "{{ contrato.idPersona.cedula|escapejs }}", 
              nombres: "{{ contrato.idPersona.nombres|escapejs }}", 
              apellidos: "{{ contrato.idPersona.apellidos|escapejs }}" 
          },
      {% endfor %}
  ];

  function checkContrato() {
      const input = document.getElementById('idContrato').value;
      const icon = document.getElementById('check-icon');
      const foundContrato = contratos.find(contrato => contrato.idContrato === input);

      if (foundContrato) {
          icon.innerHTML = '✔️'; // Pajarito verde
          icon.style.color = 'blue';

          // Mostrar alerta con los datos del contrato
          const alertHTML = `
          <div class="alert alert-success alert-dismissible fade show" role="alert">
              <strong style="color: orange; font-size: 1.2em;">Contrato encontrado:</strong><br>
              <span style="font-style: italic;">Cédula: ${foundContrato.cedula}</span><br>
              <span style="font-style: italic;">Nombres: ${foundContrato.nombres}</span><br>
              <span style="font-style: italic;">Apellidos: ${foundContrato.apellidos}</span>
              <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                  <span aria-hidden="true">&times;</span>
              </button>
          </div>
          `;

          // Insertar la alerta en el DOM
          document.getElementById('alert-container').innerHTML = alertHTML;
      } else {
          icon.innerHTML = '❌'; // X roja
          icon.style.color = 'red';

          // Mostrar alerta de que no se encontró el contrato
          const alertHTML = `
              <div class="alert alert-danger alert-dismissible fade show" role="alert">
                  <strong>Contrato no encontrado</strong>
                  <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                      <span aria-hidden="true">&times;</span>
                  </button>
              </div>
          `;

          // Insertar la alerta en el DOM
          document.getElementById('alert-container').innerHTML = alertHTML;
      }
  }
</script>
{% endblock javascripts %}
