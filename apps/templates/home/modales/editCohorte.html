{% block stylesheets %}
<link rel="stylesheet" href="/static/assets/css/styleForms.css" />
<link rel="stylesheet" href="/static/assets/css/argon.css" />
{% endblock stylesheets %}
{% block content %}
{% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
<div class=" mt-5">
  <h2 class="text-center text-dark" style="margin: 0 auto; padding: 5px 0 15px;">Modificar Cohorte</h2>
  <form method="POST" class="mt-3 text-dark" autocomplete="off" style="font-weight: bold; max-width: 600px; margin: 0 auto;" id="editCohorteForm" action="/editCohorte/{{ cohorte.idCohorte }}/">
    {% csrf_token %}    
  
    <div class="form-group text-center">
      <label for="nombreCohorte" class="d-block">Nombre:</label>
      <input type="text" id="nombreCohorte" name="nombreCohorte" class="form-control text-dark mx-auto" placeholder="Ingrese un nombre" tabindex="3" maxlength="100" required style="width: 50%;" />
      <input type="hidden" id="estadoCohorte" name="estadoCohorte" class="form-control text-dark" value="ACTIVO" />
    </div>
    <div class="text-center">
      <button type="submit" class="btn btn-warning">Actualizar</button>
    </div>
  </form>
{% endblock content %}

{% block javascripts %}

<script>
  document.addEventListener("DOMContentLoaded", function() {
    $('c').on('show.bs.modal', function (e) {
      var modal = $(this);
      $.ajax({
        url: 'apps/home/cohorte.html',
        method: 'GET',
        success: function(data) {
          modal.find('.modal-body').html(data);
        }
      });
    });
    //Validar solo letras 
  });
  document.getElementById("nombreCohorte").addEventListener("input", function() {
    const input = this;
    const errorElement = document.getElementById("roman-error");
    
    // 1. Forzar mayúsculas y filtrar caracteres
    input.value = input.value.toUpperCase().replace(/[^MDCLXVI]/g, '');
    
    // 2. Validación estricta de número romano
    const isValid = /^M{0,3}(CM|CD|D?C{0,3})(XC|XL|L?X{0,3})(IX|IV|V?I{0,3})$/.test(input.value);
    
    // 3. Mostrar feedback
    if (input.value && !isValid) {
        input.classList.add("is-invalid");
        errorElement.textContent = "Formato inválido. Ejemplos válidos: VIII, XIX, MMXXIII";
    } else {
        input.classList.remove("is-invalid");
        errorElement.textContent = "";
    }
});
//Recarga dinamica

$(document).on('submit', '#editCohorteForm', function(e) {
      e.preventDefault();
      var form = $(this);
      $.ajax({
        url: form.attr('action'),
        method: form.attr('method'),
        data: form.serialize(),
        success: function(response) {
          var messagesContainer = $('#modalMessages');
          messagesContainer.empty();
          if (response.success) {
            messagesContainer.append('<div class="alert alert-success alert-dismissible fade show" role="alert">' + response.message + '</div>');
            $('#cohorteModal').modal('hide');
            location.reload();  // Recargar la página para ver los cambios
          } else {
            // Mostrar errores en el modal
            var errors = response.errors;
            for (var field in errors) {
              messagesContainer.append('<div class="alert alert-danger alert-dismissible fade show" role="alert">' + errors[field] + '</div>');
            }
          }
        }
      });
    });
</script>

{% endblock javascripts %}
