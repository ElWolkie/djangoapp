{% block stylesheets %}
<link rel="stylesheet" href="/static/assets/css/styleForms.css" />
<link rel="stylesheet" href="/static/assets/css/argon.css" />
{% endblock stylesheets %}

{% block content %}
<div class="mt-5">
  <h2 class="text-center text-dark" style="margin: 0 auto; padding: 5px 0 15px;">Editar Formación</h2>
  <form method="POST" id="editFormacionForm" action="{% url 'edit_formacion' formacion.pk %}" class="mt-3 text-dark" autocomplete="off">
    {% csrf_token %}
    <div class="form-group">
      <label for="idTF">Tipo de Formación:</label>
      <select id="idTF" name="idTF" class="form-control" required>
        {% for tipo in tipos_formacion %}
        <option value="{{ tipo.idTF }}" {% if tipo.idTF == formacion.idTF.idTF %}selected{% endif %}>{{ tipo.nombreTipoFormacion }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="nombreFormacion">Nombre:</label>
      <input type="text" id="nombreFormacion" name="nombreFormacion" class="form-control" value="{{ formacion.nombreFormacion }}" required>
    </div>
    <div class="form-group">
      <label for="duracion">Duración:</label>
      <input type="text" id="duracion" name="duracion" class="form-control" value="{{ formacion.duracion }}" required>
    </div>
    <input type="hidden" id="estadoFormacion" name="estadoFormacion" value="{{ formacion.estadoFormacion }}">

    <div class="text-center">
      <button type="submit" class="btn btn-primary">Actualizar</button>
    </div>
  </form>
</div>
{% endblock content %}

{% block javascripts %}
<script>
  $(document).on('submit', '#editFormacionForm', function(e) {
    e.preventDefault();
    var form = $(this);
    $.ajax({
      url: form.attr('action'),
      method: form.attr('method'),
      data: form.serialize(),
      success: function(response) {
        var messagesContainer = $('#modalMessages');
        messagesContainer.empty();
        if (response.success) {
          messagesContainer.append('<div class="alert alert-success alert-dismissible fade show" role="alert">' + response.message + '</div>');
          $('#editFormacionModal').modal('hide');
          location.reload(); // Recargar la página para reflejar los cambios
        } else {
          var errors = response.errors;
          for (var field in errors) {
            messagesContainer.append('<div class="alert alert-danger alert-dismissible fade show" role="alert">' + errors[field] + '</div>');
          }
        }
      },
      error: function() {
        alert('Error al procesar la solicitud.');
      },
    });
  });
</script>
{% endblock javascripts %}
