{% block stylesheets %}
<link rel="stylesheet" href="/static/assets/css/styleForms.css" />
<link rel="stylesheet" href="/static/assets/css/argon.css" />
{% endblock stylesheets %}
{% block content %}
{% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
<div class=" mt-5">
  <h2 class="text-center text-dark" style="margin: 0 auto; padding: 5px 0 15px;">Editar Tasa Cambiaria</h2>
  <form method="POST" class="mt-3 text-dark" autocomplete="off" style="font-weight: bold; max-width: 600px; margin: 0 auto;" id="editTasaForm" action="{% url 'edit_tasa' tasa.idTasa%}">  
    {% csrf_token %}  
    
    <div class="form-row">  
      <div class="form-group col-md-6">  
        <label for="idMoneda">Moneda:</label>  
        <div class="input-group"> <!-- Usar input-group para alinear botón y select -->  
          <select id="idMoneda" name="idMoneda" class="form-control text-dark" tabindex="1" required>  
            <option value="" disabled selected>Seleccione..</option>  
            {% for moneda in monedas %}  
            <option value="{{ moneda.idMoneda }}" class="text-orange" {% if moneda.idMoneda == tasa.idMoneda_id %}selected{% endif %}>
      {{ moneda.nombreMoneda }}            {% endfor %}
          </select>  
        </div>  
      </div>  
      
      <div class="form-group col-md-6">  
        <label for="montoTasa">Monto:</label>  
        <input type="text" id="montoTasa" name="montoTasa" class="form-control text-dark" value="{{tasa.montoTasa}}" placeholder="64,86" tabindex="3" maxlength="50" required />  
        <input type="hidden" id="estadoTasa" name="estadoTasa" class="form-control text-dark" value="ACTIVO" />  
      </div>  
    </div>  
    
    <div class="text-center">  
      <input type="submit" class="btn btn-warning mt-4" value="Guardar" />  
    </div>  
  </form>
{% endblock content %}

{% block javascripts %}
<script>
  document.addEventListener("DOMContentLoaded", function() {
    $('c').on('show.bs.modal', function (e) {
      var modal = $(this);
      $.ajax({
        url: 'apps/home/tasa.html',
        method: 'GET',
        success: function(data) {
          modal.find('.modal-body').html(data);
        }
      });
    });
  });
  
//Recarga dinamica

$(document).on('submit', '#registroForm', function(e) {
      e.preventDefault();
      var form = $(this);
      $.ajax({
        url: form.attr('action'),
        method: form.attr('method'),
        data: form.serialize(),
        success: function(response) {
          var messagesContainer = $('#modalMessages');
          messagesContainer.empty();
          if (response.success) {
            messagesContainer.append('<div class="alert alert-success alert-dismissible fade show" role="alert">' + response.message + '</div>');
            $('#tasaModal').modal('hide');
            location.reload();  // Recargar la página para ver los cambios
          } else {
            // Mostrar errores en el modal
            var errors = response.errors;
            for (var field in errors) {
              messagesContainer.append('<div class="alert alert-danger alert-dismissible fade show" role="alert">' + errors[field] + '</div>');
            }
          }
        }
      });
    });

    // Validación y formato español en montoTasa
document.getElementById("montoTasa").addEventListener("input", function() {
  const input = this;
  const raw = input.value;
  const oldPos = input.selectionStart;

  // ❌ Bloquear letras desde el inicio
  if (/[A-Za-z]/.test(raw)) {
    // Elimina letras inmediatamente
    input.value = raw.replace(/[A-Za-z]/g, '');
    return;
  }

  // Contar dígitos antes del cursor
  const digitsBefore = raw.slice(0, oldPos).replace(/[^0-9]/g, '').length;

  // Limpiar y parsear
  const cleaned = raw
    .replace(/\./g, '')     // quitar puntos previos
    .replace(/,/g, '.')     // coma → punto para parsear
    .replace(/[^0-9.]/g, ''); 
  const num = parseFloat(cleaned);
  if (isNaN(num)) return;

  // Formatear en estilo español (puntos de miles, coma decimal)
  const formatted = num.toLocaleString('es-VE', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });

  // Calcular nueva posición del cursor
  let newPos = 0, counted = 0;
  for (let i = 0; i < formatted.length; i++) {
    if (/[0-9]/.test(formatted[i])) counted++;
    if (counted === digitsBefore) {
      newPos = i + 1;
      break;
    }
  }
  if (counted < digitsBefore) {
    newPos = formatted.length;
  }

  // Aplicar resultado y posicionar cursor
  input.value = formatted;
  input.setSelectionRange(newPos, newPos);
  });

    // Validación de formulario
    var forms = document.querySelectorAll('.needs-validation');
    Array.prototype.slice.call(forms).forEach(function(form) {
      form.addEventListener('submit', function(event) {
        if (!form.checkValidity()) {
          event.preventDefault();
          event.stopPropagation();
        }
        form.classList.add('was-validated');
      }, false);
    });
</script>

{% endblock javascripts %}
