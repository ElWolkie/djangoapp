{% load static %}

{% block stylesheets %}
<link rel="stylesheet" href="/static/assets/css/styleForms.css" />
<link rel="stylesheet" href="/static/assets/css/argon.css" />
<style>
/* estilo igual que los anteriores */
.persona-container { background: linear-gradient(135deg,#f8fafc 0%,#eef2f6 100%); border-radius:1rem; box-shadow:0 0.5rem 1.5rem rgba(0,0,0,0.1); padding:1.5rem; margin:0.5rem auto; max-width:95%; width:100%; }
.persona-header { text-align:center; margin-bottom:1.5rem; position:relative; padding-bottom:1rem; }
.persona-header h2 { color:#343a40; font-weight:700; font-size:1.3rem; margin-bottom:.5rem; }
.form-group { margin-bottom:1.2rem; position:relative; }
.form-label { font-weight:700; color:#495057; margin-bottom:.5rem; display:flex; align-items:center; font-size:.95rem; }
.form-label i { margin-right:8px; color:#fd7e14; font-size:.95rem; }
.form-control { border-radius:.5rem; padding:.75rem 1.25rem; border:1px solid #ced4da; background:#fff; height:48px; font-size:.95rem; }
.input-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#6c757d; z-index:2; font-size:.9rem; }
.input-with-icon { padding-left:40px; }
.btn-submit { background:linear-gradient(135deg,#ffc107 0%,#fd7e14 100%); border:none; color:#fff; font-weight:600; padding:.75rem 2rem; border-radius:.5rem; box-shadow:0 4px 6px rgba(0,0,0,.1); font-size:1rem; }
.modal-body { padding:.75rem; }
#modalMessages .alert { margin-bottom:.5rem; }
</style>
{% endblock stylesheets %}

{% block content %}
<div class="persona-container">
  <div class="persona-header">
    <h2><i class="fas fa-briefcase text-warning"></i> Editar Cargo</h2>
    <p class="text-muted">Cambia el nombre del cargo</p>
  </div>

  <div id="modalMessages"></div>

  <form id="editCargoForm" method="post" action="{% url 'edit_cargo' cargo.idCargo %}" class="needs-validation" novalidate autocomplete="off">
    {% csrf_token %}
    <div class="row">
      <div class="col-md-12">
        <div class="form-group position-relative">
          <label class="form-label" for="nombreCargo"><i class="fas fa-user-tie"></i> Nombre Cargo</label>
          <div class="input-group" style="position:relative;">
            <i class="fas fa-user-tie input-icon"></i>
            <input id="nombreCargo" name="nombreCargo" type="text" class="form-control input-with-icon" value="{{ cargo.nombreCargo }}" maxlength="40" required />
          <div class="invalid-feedback">Por favor ingrese un nombre válido (solo letras y espacios).</div>
        </div>
      </div>

      <input type="hidden" name="estadoCargo" value="{{ cargo.estadoCargo }}" />
    </div>

    <div class="text-center mt-2">
      <button type="submit" class="btn-submit"><i class="fas fa-save me-2"></i> Guardar</button>
    </div>
  </form>
</div>
{% endblock content %}

{% block javascripts %}
<script src="{% static 'assets/js/sweetalert2@11.js' %}"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const form = document.getElementById('editCargoForm');
  const nombre = document.getElementById('nombreCargo');
  const modalMessages = document.getElementById('modalMessages');

  // Forzar mayúsculas y sólo letras + espacios
  nombre && nombre.addEventListener('input', e => {
    e.target.value = e.target.value.toUpperCase().replace(/[^A-ZÑ\s]/g,'').slice(0,40);
  });

  form.addEventListener('submit', function(e) {
    if (!form.checkValidity()) { e.preventDefault(); e.stopPropagation(); form.classList.add('was-validated'); return; }

    e.preventDefault();
    modalMessages.innerHTML = '';
    const btn = form.querySelector('button[type="submit"]'); btn.disabled = true;

    $.ajax({
      url: form.action,
      method: 'POST',
      data: $(form).serialize(),
      dataType: 'json',
      headers: { 'X-Requested-With': 'XMLHttpRequest' }
    }).done(function(resp){
      if (resp.success) {
        Swal.fire({ icon: 'success', title: 'Cargo actualizado', text: resp.message || 'Cambios guardados', confirmButtonColor: '#ffc107' })
        .then(()=> window.location.reload());
      } else {
        if (resp.errors) {
          Object.entries(resp.errors).forEach(([f, msgs]) => {
            const el = form.querySelector('[name="'+f+'"]');
            if (el) { el.classList.add('is-invalid'); const fb = el.nextElementSibling; if (fb && fb.classList.contains('invalid-feedback')) fb.textContent = msgs.join(', '); }
            else modalMessages.insertAdjacentHTML('beforeend', '<div class="alert alert-danger">'+ msgs.join(', ') +'</div>');
          });
        } else if (resp.message) {
          modalMessages.innerHTML = '<div class="alert alert-danger">'+ resp.message +'</div>';
        }
      }
    }).fail(function(){ modalMessages.innerHTML = '<div class="alert alert-danger">Error en servidor.</div>'; })
      .always(function(){ btn.disabled = false; });
  }, false);
});
</script>
{% endblock javascripts %}
