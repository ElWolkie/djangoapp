{% block stylesheets %}
<link rel="stylesheet" href="/static/assets/css/styleForms.css" />
<link rel="stylesheet" href="/static/assets/css/argon.css" />
{% endblock stylesheets %}
{% block content %}
{% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
<div class=" mt-5">
  <h2 class="text-center text-dark" style="margin: 0 auto; padding: 5px 0 15px;">Actualizar Cargo</h2>
  <form method="POST" class="mt-3 text-dark" autocomplete="off" style="font-weight: bold; max-width: 600px; margin: 0 auto;" id="editCargoForm" action="{% url 'edit_cargo' cargo.idCargo %}">
    {% csrf_token %}
    <div class="form-group text-center">
      <label for="nombreCargo" class="d-block">Nombre:</label>
      <input type="text" id="nombreCargo" name="nombreCargo" class="form-control text-dark mx-auto" placeholder="Ingrese un nombre" tabindex="3" maxlength="100"  style="width: 50%;"  />
      <input type="hidden" id="estadoCargo" name="estadoCargo" class="form-control text-dark" value="ACTIVO" />
    </div>
    <div class="text-center">
      <input type="submit" class="btn btn-warning mt-4" value="Actualizar" />
    </div>
  </form>
{% endblock content %}

{% block javascripts %}
<script>
  document.addEventListener("DOMContentLoaded", function() {
    $('c').on('show.bs.modal', function (e) {
      var modal = $(this);
      $.ajax({
        url: 'home/modales/editCargo.html',
        method: 'GET',
        success: function(data) {
          modal.find('.modal-body').html(data);
        }
      });
    });
    //Validar solo letras 
  });
  document.getElementById("nombreCargo").addEventListener("input", function() {
    this.value = this.value.replace(/[^a-zA-Z\s]/g, '');
  });
  
//Recarga dinamica

$(document).on('submit', '#editCargoForm', function(e) {
      e.preventDefault();
      var form = $(this);
      $.ajax({
        url: form.attr('action'),
        method: form.attr('method'),
        data: form.serialize(),
        success: function(response) {
          var messagesContainer = $('#modalMessages');
          messagesContainer.empty();
          if (response.success) {
            messagesContainer.append('<div class="alert alert-success alert-dismissible fade show" role="alert">' + response.message + '</div>');
            $('#editModal').modal('hide');
            location.reload();  // Recargar la página para ver los cambios
          } else {
            // Mostrar errores en el modal
            var errors = response.errors;
            for (var field in errors) {
              messagesContainer.append('<div class="alert alert-danger alert-dismissible fade show" role="alert">' + errors[field] + '</div>');
            }
          }
        }
      });
    });
</script>

{% endblock javascripts %}
