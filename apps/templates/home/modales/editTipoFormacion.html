{% block stylesheets %}
<link rel="stylesheet" href="/static/assets/css/styleForms.css" />
<link rel="stylesheet" href="/static/assets/css/argon.css" />
{% endblock stylesheets %}

{% block content %}
{% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
      </div>
    {% endfor %}
{% endif %}
<div class="mt-5">
  <h2 class="text-center text-dark" style="margin: 0 auto; padding: 5px 0 15px;">Modificar Tipo de Formación</h2>
  <form method="POST" id="editTipoFormacionForm" action="{% url 'edit_tf' tipoFormacion.idTF %}" class="mt-3 text-dark" autocomplete="off" style="font-weight: bold; max-width: 600px; margin: 0 auto;">
    {% csrf_token %}
    <div class="form-group text-center">
      <label for="nombreTipoFormacion" class="d-block">Nombre:</label>
      <input type="text" id="nombreTipoFormacion" name="nombreTipoFormacion" class="form-control text-dark mx-auto" placeholder="Ingrese el nombre del tipo de formación" maxlength="100" required style="width: 50%;" value="{{ form.nombreTipoFormacion.value }}" />
      <label for="cuotas" class="d-block">Cuotas:</label>
      <input type="text" id="cuotas" name="cuotas" class="form-control text-dark mx-auto" placeholder="Ingrese la cantidad de cuotas" maxlength="5" required style="width: 50%;" value="{{ form.cuotas.value }}">
      <input type="hidden" id="estadoTipoFormacion" name="estadoTipoFormacion" class="form-control text-dark" value="{{ form.estadoTipoFormacion.value }}" />
    </div>
    <div class="text-center">
      <input type="submit" class="btn btn-primary mt-4" value="Actualizar" />
    </div>
  </form>
</div>
{% endblock content %}

{% block javascripts %}
<script>
  $(document).on('submit', '#editTipoFormacionForm', function(e) {
    e.preventDefault();
    var form = $(this);
    $.ajax({
      url: form.attr('action'),
      method: form.attr('method'),
      data: form.serialize(),
      success: function(response) {
        var messagesContainer = $('#modalMessages');
        messagesContainer.empty();
        if (response.success) {
          messagesContainer.append('<div class="alert alert-success alert-dismissible fade show" role="alert">' + response.message + '</div>');
          $('#editModal').modal('hide');
          location.reload(); // Recargar la página para reflejar los cambios
        } else {
          // Mostrar errores en el modal
          var errors = response.errors;
          for (var field in errors) {
            messagesContainer.append('<div class="alert alert-danger alert-dismissible fade show" role="alert">' + errors[field] + '</div>');
          }
        }
      },
      error: function() {
        alert('Error al procesar la solicitud.');
      },
    });
  });
</script>
{% endblock javascripts %}
