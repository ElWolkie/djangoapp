{% block stylesheets %}
<link rel="stylesheet" href="/static/assets/css/styleForms.css" />
<link rel="stylesheet" href="/static/assets/css/argon.css" />
{% endblock stylesheets %}

{% block content %}
<div class="mt-5">
  <h2 class="text-center text-dark" style="margin: 0 auto; padding: 5px 0 15px;">Registrar Formación</h2>
  <form method="POST" id="formacionForm" action="{% url 'formacion_modal' %}" class="mt-3 text-dark" autocomplete="off" style="font-weight: bold; max-width: 600px; margin: 0 auto;">
    {% csrf_token %}
    <div class="form-group">
      <label for="idTF">Tipo de Formación:</label>
      <select id="idTF" name="idTF" class="form-control" required>
        {% for tipo in tipos_formacion %}
        <option value="{{ tipo.idTF }}">{{ tipo.nombreTipoFormacion }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="nombreFormacion">Nombre:</label>
      <input type="text" id="nombreFormacion" name="nombreFormacion" class="form-control" placeholder="Ingrese el nombre de la formación" maxlength="100" required>
    </div>
    <div class="form-group">
      <label for="duracion">Duración:</label>
      <input type="text" id="duracion" name="duracion" class="form-control" placeholder="Ingrese la duración" maxlength="50" required>
    </div>
    <input type="hidden" id="estadoFormacion" name="estadoFormacion" value="ACTIVO">
    <div class="text-center">
      <button type="submit" class="btn btn-primary mt-4">Registrar</button>
    </div>
  </form>
</div>
{% endblock content %}

{% block javascripts %}
<script>
  document.addEventListener("DOMContentLoaded", function() {
    // Validar solo letras
    document.getElementById("nombreFormacion").addEventListener("input", function() {
      this.value = this.value.replace(/[^a-zA-Z\s]/g, '');
      if (this.value.length > 100) {
        this.value = this.value.slice(0, 100);
      }
    });


  });
</script>
{% endblock javascripts %}
