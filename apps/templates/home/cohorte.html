{% block stylesheets %}
<link rel="stylesheet" href="/static/assets/css/styleForms.css" />
<link rel="stylesheet" href="/static/assets/css/argon.css" />
{% endblock stylesheets %}
{% block content %}
{% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
<div class=" mt-5">
  <h2 class="text-center text-dark" style="margin: 0 auto; padding: 5px 0 15px;">Registrar Cohorte</h2>
  <form method="POST" class="mt-3 text-dark" autocomplete="off" style="font-weight: bold; max-width: 600px; margin: 0 auto;" id="cohorteForm" action="{% url 'cohorte_modal' %}">
    {% csrf_token %}
    <div class="form-group text-center">
      <label for="nombreCohorte" class="d-block">Nombre:</label>
      <input type="text" id="nombreCohorte" name="nombreCohorte" class="form-control text-dark mx-auto" placeholder="Ingrese un nombre" tabindex="3" maxlength="100" required style="width: 50%;" />
      <input type="hidden" id="estadoCohorte" name="estadoCohorte" class="form-control text-dark" value="ACTIVO" />
    </div>
    <div class="text-center">
      <input type="submit" class="btn btn-warning mt-4" value="Guardar" />
    </div>
  </form>
{% endblock content %}

{% block javascripts %}
{% endblock javascripts %}
