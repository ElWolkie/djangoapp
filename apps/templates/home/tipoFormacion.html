{% block stylesheets %}
<link rel="stylesheet" href="/static/assets/css/styleForms.css" />
<link rel="stylesheet" href="/static/assets/css/argon.css" />
{% endblock stylesheets %}
{% block content %}
{% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
<div class=" mt-5">
  <h2 class="text-center text-dark" style="margin: 0 auto; padding: 5px 0 15px;">Registrar Tipo de Formación</h2>
  <form method="POST" id="tipoFormacionForm" action="{% url 'tipo_formacion_modal' %}">
    {% csrf_token %}
    <div class="form-group">
      <label for="nombreTipoFormacion">Nombre:</label>
      <input type="text" id="nombreTipoFormacion" name="nombreTipoFormacion" class="form-control" placeholder="Ingrese el nombre del tipo de formación" required>
    </div>
    
    <div class="form-group">
      <label for="cuotas">Cuotas:</label>
      <input type="text" id="cuotas" name="cuotas" class="form-control" placeholder="Ingrese la cantidad de cuotas" maxlength="5" required>
    </div>
    
    <div class="form-group">
      <input type="hidden" id="estadoTipoFormacion" name="estadoTipoFormacion" value="ACTIVO">
    </div>
    <div class="text-center">
      <button type="submit" class="btn btn-primary">Guardar</button>
    </div>
  </form>
 {% endblock content %}
{% block javascripts %}
<script>
document.addEventListener("DOMContentLoaded", function() {
    // Validar solo letras
    document.getElementById("nombreTipoFormacion").addEventListener("input", function() {
      this.value = this.value.replace(/[^a-zA-Z\s]/g, '');
      if (this.value.length > 20) {
        this.value = this.value.slice(0, 20);
      }
    });
  });
</script>

{% endblock javascripts %}
