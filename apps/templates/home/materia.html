{% block stylesheets %}
<link rel="stylesheet" href="/static/assets/css/styleForms.css" />
<link rel="stylesheet" href="/static/assets/css/argon.css" />
{% endblock stylesheets %}
{% block content %}
{% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
<div class=" mt-5">
  <h2 class="text-center text-dark" style="margin: 0 auto; padding: 5px 0 15px;">Registrar Materia</h2>
  <form method="POST" class="mt-3 text-dark" autocomplete="off" style="font-weight: bold; max-width: 600px; margin: 0 auto;" id="materiaForm" action="{% url 'materia_modal' %}">  
    {% csrf_token %}  
    
    <div class="form-row">  
      <div class="form-group col-md-6">  
        <label for="idOferta">Oferta Académica:</label>  
        <div class="input-group"> <!-- Usar input-group para alinear botón y select -->  
            <select id="idOferta" name="idOferta" class="form-control text-dark" tabindex="1" required>  
                <option value="" disabled selected>Seleccione...</option>  
                {% for oferta in ofertas %}  
                    <option value="{{ oferta.idOferta }}" class="text-orange">{{ oferta.nombreOferta }}</option>  
                {% endfor %}  
            </select>  
        </div>  
    </div>
      
      <div class="form-group col-md-6">  
        <label for="nombreMateria">Nombre:</label>  
        <input type="text" id="nombreMateria" name="nombreMateria" class="form-control text-dark" placeholder="Ingrese un nombre" tabindex="3" maxlength="100" required />  
        <input type="hidden" id="estadoMateria" name="estadoMateria" class="form-control text-dark" value="ACTIVO" />  
        
      </div>  
    
    </div>  
    
    <div class="text-center">  
      <input type="submit" class="btn btn-warning mt-4" value="Guardar" />  
    </div>  
  </form>
{% endblock content %}

{% block javascripts %}
{% endblock javascripts %}
