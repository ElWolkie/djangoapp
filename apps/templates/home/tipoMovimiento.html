{% block stylesheets %}
<link rel="stylesheet" href="/static/assets/css/styleForms.css" />
<link rel="stylesheet" href="/static/assets/css/argon.css" />
{% endblock stylesheets %}
{% block content %}
{% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
<div class=" mt-5">
<form method="POST" class="mt-3 text-dark" autocomplete="off" style="font-weight: bold; max-width: 600px; margin: 0 auto;" id="tipoMovimientoForm" action="{% url 'tipoMovimiento_modal' %}">
    {% csrf_token %}
    <div class="form-group text-center">
      <input type="hidden" name="naturaleza" value="" /> <!-- Este valor será llenado dinámicamente -->
      <label for="nombreTipoMovimiento" class="d-block">Nombre:</label>
      <input type="text" id="nombreTipoMovimiento" name="nombreTipoMovimiento" class="form-control text-dark mx-auto" placeholder="Ingrese un nombre" tabindex="3" maxlength="100" required style="width: 50%;" />
      <input type="hidden" id="estadoTipoMovimiento" name="estadoTipoMovimiento" class="form-control text-dark" value="ACTIVO" />
    </div>
    <div class="text-center">
      <input type="submit" class="btn btn-warning mt-4" value="Guardar" />
    </div>
  </form>
{% endblock content %}

{% block javascripts %}
<script>
  document.addEventListener("DOMContentLoaded", function() {
    $('c').on('show.bs.modal', function (e) {
      var modal = $(this);
      $.ajax({
        url: 'apps/home/tipoMovimiento.html',
        method: 'GET',
        success: function(data) {
          modal.find('.modal-body').html(data);
        }
      });
    });
    //Validar solo letras 
  });
  document.getElementById("horas").addEventListener("input", function() {  
    this.value = this.value.replace(/[^0-9,]/g, '');  

    if (this.value.length > 20) {  
        this.value = this.value.slice(0, 20);  
    }  
});  
//Recarga dinamica

$(document).on('submit', '#registroForm', function(e) {
      e.preventDefault();
      var form = $(this);
      $.ajax({
        url: form.attr('action'),
        method: form.attr('method'),
        data: form.serialize(),
        success: function(response) {
          var messagesContainer = $('#modalMessages');
          messagesContainer.empty();
          if (response.success) {
            messagesContainer.append('<div class="alert alert-success alert-dismissible fade show" role="alert">' + response.message + '</div>');
            $('#tipoMovimientoModal').modal('hide');
            location.reload();  // Recargar la página para ver los cambios
          } else {
            // Mostrar errores en el modal
            var errors = response.errors;
            for (var field in errors) {
              messagesContainer.append('<div class="alert alert-danger alert-dismissible fade show" role="alert">' + errors[field] + '</div>');
            }
          }
        }
      });
    });
</script>
{% endblock javascripts %}
