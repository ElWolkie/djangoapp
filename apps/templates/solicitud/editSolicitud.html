{% block stylesheets %}
<link rel="stylesheet" href="/static/assets/css/styleForms.css" />
<link rel="stylesheet" href="/static/assets/css/argon.css" />
{% endblock stylesheets %}
{% block content %}
  <h2 class="text-center text-dark" style="margin: 0 auto; padding: 5px 0 15px;">Editar Solicitud</h2>
  
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
  
  <form method="POST" class="mt-3 text-dark" autocomplete="off" style="font-weight: bold; max-width: 600px; margin: 0 auto;" id="editSolicitudForm" action="{% url 'edit_solicitud' solicitud.idSoli %}">  
    {% csrf_token %}
    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <label for="cedulaPersona">Cédula: <span id="cedulaDisplay" class="text-primary"></span></label>  
          <div class="input-group"> <!-- Usar input-group para alinear botón y select -->  
              <input type="text" id="cedulaPersona" name="cedulaPersona" class="form-control text-dark" value="{{ solicitud.idPersona.cedula }}" tabindex="1" required oninput="checkPersona()" {% if solicitud.idPersona %}{% endif %} readonly/>  
              <div class="input-group-append">
                  <span id="check-icon" class="input-group-text"></span>
              </div>
              <input type="hidden" id="idPersona" name="idPersona" value="{{ solicitud.idPersona.idPersona }}" />
          </div>
        </div>
        <div class="form-group">
          <label for="tramite">Tipo de Trámite:</label>
          <select id="idTramite" name="idTramite" class="form-control text-dark" tabindex="1" required>  
            <option value="" disabled selected>Seleccione..</option>  
           {% for tramite in tramites %}  
              <option value="{{ tramite.idTramite }}" class="text-orange" {% if tramite.idTramite == solicitud.idTramite.idTramite %}selected{% endif %}>{{ tramite.nombreTramite }}</option>  
            {% endfor %}
          </select>  
        </div>
        <div class="form-group">
          <label for="servicio">Tipo de Servicio:</label>
          <select id="idServicio" name="idServicio" class="form-control text-dark" tabindex="1" required>  
            <option value="" disabled selected>Seleccione..</option>  
           {% for servicio in servicios %}  
              <option value="{{ servicio.idServicio }}" class="text-orange" {% if servicio.idServicio == solicitud.idServicio.idServicio %}selected{% endif %}>{{ servicio.nombreServicio }}</option>  
            {% endfor %}
          </select>  
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label for="montoTotal">Monto Total:</label>
          <input type="text" id="montoTotal" name="montoTotal" class="form-control text-dark" value="{{ solicitud.montoTotal }}" placeholder="0" tabindex="2" maxlength="8" required />
        </div>
        <div class="form-group">
          <label for="fechaEntrega">Fecha de Entrega:</label>
            <input type="date" id="fechaEntrega" name="fechaEntrega" class="form-control text-dark" value="{{ solicitud.fechaEntrega|date:'Y-m-d' }}" tabindex="4" maxlength="100" required />
          <input type="hidden" id="estadoSolicitud" name="estadoSolicitud" class="form-control text-dark" value="ACTIVO" />
        </div>
      </div>
    </div>
    <div class="text-center">
      <input type="submit" class="btn btn-warning mt-4" value="Guardar" />
    </div>
  </form>
{% endblock content %}


{% block javascripts %}
<script>
// Función para mostrar alertas en #alert-container
function showInlineAlert(type, html) {
  const wrapper = document.getElementById('alert-container');
  wrapper.innerHTML = `
    <div class="alert alert-${type} alert-dismissible fade show" role="alert">
      ${html}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>`;
}

// Función para mostrar mensaje global tras AJAX
function showGlobal(type, text) {
  const gm = document.getElementById('globalMessages');
  gm.insertAdjacentHTML('afterbegin', `
    <div class="alert alert-${type} alert-dismissible fade show" role="alert">
      ${text}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>`);
}

document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('editSolicitudForm');
  const cedulaInput = document.getElementById('cedulaPersona');
  const checkIcon   = document.getElementById('check-icon');
  const personas    = [
    {% for p in personas %}
      { id:"{{ p.idPersona }}", cedula:"{{ p.cedula }}", nombres:"{{ p.nombres }}", apellidos:"{{ p.apellidos }}" },
    {% endfor %}
  ];

  // Validar persona al cargar (está en readonly)
  const persona = personas.find(p => p.cedula === cedulaInput.value);
  if (persona) {
    checkIcon.innerHTML = '<i class="fas fa-check-circle text-success"></i>';
    showInlineAlert('success', `<strong>Persona:</strong> ${persona.nombres} ${persona.apellidos}`);
  } else {
    checkIcon.innerHTML = '<i class="fas fa-times-circle text-danger"></i>';
    showInlineAlert('danger', 'Persona no encontrada');
  }

  // Manejar envío AJAX
  form.addEventListener('submit', e => {
    e.preventDefault();

    const url = new URL(window.location.href).pathname;
    const data = new FormData(form);

    fetch(url, {
      method: 'POST',
      headers: { 'X-Requested-With': 'XMLHttpRequest' },
      body: data
    })
    .then(r => r.json())
    .then(json => {
      if (json.success) {
        showGlobal('success', json.message || 'Solicitud actualizada.');
        setTimeout(() => window.location.reload(), 800);
      } else {
        // errores de campo
        const errors = Object.values(json.errors).flat();
        showInlineAlert('danger', errors.map(e=>`<div>${e}</div>`).join(''));
      }
    })
    .catch(err => {
      console.error(err);
      showGlobal('danger', 'Error inesperado al procesar la solicitud.');
    });
  });
});
</script>
{% endblock javascripts %}
