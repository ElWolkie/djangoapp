{% load static %}

{% block stylesheets %}
<link rel="stylesheet" href="{% static 'assets/css/styleForms.css' %}" />
<link rel="stylesheet" href="{% static 'assets/css/argon.css' %}" />
{% endblock %}

{% block content %}
  <h2 class="text-center text-dark" style="margin:0 auto; padding:5px 0 15px;">
      Editar Inscripción
  </h2>

<form id="editInscripcionForm"
      method="POST"
      action="{% url 'edit_inscripcion' inscripcion.idInscripcion %}"
      class="mt-3 text-dark needs-validation"
      autocomplete="off"
      novalidate
      style="font-weight:bold; max-width:600px; margin:0 auto;">

  {% csrf_token %}
  
  <!-- Primera fila: Cédula y Cohorte -->
  <div class="row">
    <!-- CÉDULA (DESHABILITADA) -->
    <div class="form-group col-md-6">
      <label for="cedulaPersona">Cédula del Cliente:</label>
      <div class="input-group">
        <input type="text"
               id="cedulaPersona"
               class="form-control text-dark"
               value="{{ inscripcion.idPersona.cedula }}"
               disabled>
        <!-- Enviamos la cédula (si la necesitas en el backend) -->
        <input type="hidden"
               name="cedulaPersona"
               value="{{ inscripcion.idPersona.cedula }}">
        <!-- Campo oculto para enviar el idPersona (único) -->
        <input type="hidden"
               id="idPersona"
               name="idPersona"
               value="{{ inscripcion.idPersona.idPersona }}">
      </div>
    </div>

    <!-- COHORTE -->
    <div class="form-group col-md-6">
      <label for="nombreCohorte">Cohorte:</label>
      <div class="input-group">
        <input type="text" 
               id="nombreCohorte" 
               name="nombreCohorte" 
               class="form-control text-dark" 
               value="{{ inscripcion.idCohorte.nombreCohorte }}" 
               pattern="[A-ZIVXLCDM]+" 
               data-required="true" 
               readonly>
        <div class="input-group-append">
          <span id="check-cohorte-icon" class="input-group-text"></span>
        </div>
        <div class="invalid-feedback">Por favor, seleccione una cohorte válida.</div>
        <!-- Elemento para mostrar errores de formato -->
        <small id="roman-error" class="form-text text-danger"></small>
        <!-- Campo oculto para enviar el idCohorte (se actualizará vía JS) -->
        <input type="hidden" id="idCohorte" name="idCohorte" value="{{ inscripcion.idCohorte.idCohorte }}" />
        <input type="hidden" id="estadoContrato" name="estadoContrato" class="form-control text-dark" value="ACTIVO" />
      </div>
    </div>
  </div>

  <!-- Segunda fila: Tipo de Formación y Formación Académica -->
  <div class="row">
    <!-- Tipo de Formación -->
    <div class="form-group col-md-6">
      <label for="idTF">Tipo de Formación:</label>
      <select id="idTF" name="idTF" class="form-control text-dark" data-required="true" required>
        <option value="" disabled>Seleccione..</option>
        {% for tipo in tipos_formacion %}
          <option value="{{ tipo.idTF }}" {% if tipo.idTF == inscripcion.idTF.idTF %}selected{% endif %} class="text-orange">
            {{ tipo.nombreTipoFormacion }}
          </option>
        {% endfor %}
      </select>
      <div class="invalid-feedback">Por favor, seleccione una opción válida.</div>
    </div>

    <!-- Formación Académica -->
    <div class="form-group col-md-6">  
      <label for="idFormacion">Formación Académica:</label>  
      <div class="input-group">
        <select id="idFormacion" name="idFormacion" class="form-control text-dark" tabindex="1" data-required="true" required>  
          <option value="" disabled>Seleccione...</option>  
          {% for formacion in formaciones %}  
            <option value="{{ formacion.idFormacion }}"
              {% if formacion.idFormacion == inscripcion.idFormacion.idFormacion %}selected{% endif %} 
              data-tf="{{ formacion.idTF.idTF }}"
              data-valorInscripcion="{{ formacion.valorInscripcion }}" 
              data-tieneCuotas="{{ formacion.tieneCuotas }}" 
              data-cuotasActivas="{{ formacion.cuotas_activas }}" 
              data-cantidadCuotas="{{ formacion.cantidad_cuotas }}" 
              data-cuotas="{{ formacion.cuotas_json }}">
              {{ formacion.nombreFormacion }}
            </option>           
          {% endfor %}  
        </select>
        <div class="invalid-feedback">Por favor, seleccione una formación válida.</div>
      </div>  
    </div>
  </div>

  <div id="alert-container"></div> <!-- Contenedor para las alertas -->

  <div class="text-center mt-4">
    <button type="submit" class="btn btn-warning">Guardar</button>
  </div>
</form>
{% endblock %}

{% block javascripts %}
<script src="{% static 'assets/js/sweetalert2@11.js' %}"></script>
<script>
  // Función para filtrar formaciones basado en el tipo seleccionado
  function filtrarFormaciones() {
    const tipoSelect = document.getElementById('idTF');
    const formacionSelect = document.getElementById('idFormacion');
    
    if (!tipoSelect || !formacionSelect) return;
    
    const tipoSeleccionado = tipoSelect.value;
    const opciones = formacionSelect.options;
    const valorActual = formacionSelect.value;
    
    // Mostrar todas las opciones primero
    for (let i = 0; i < opciones.length; i++) {
      opciones[i].style.display = '';
    }
    
    // Ocultar las que no coincidan con el tipo seleccionado
    if (tipoSeleccionado) {
      for (let i = 0; i < opciones.length; i++) {
        const opcion = opciones[i];
        if (opcion.value && opcion.dataset.tf !== tipoSeleccionado) {
          opcion.style.display = 'none';
        }
      }
    }
  }

  // Función principal que se ejecuta cuando el DOM está listo
  function initEditInscripcion() {
    console.log('Inicializando formulario de edición');
    
    // 1. Configurar filtro de formaciones
    const tipoSelect = document.getElementById('idTF');
    if (tipoSelect) {
      tipoSelect.addEventListener('change', filtrarFormaciones);
      // Ejecutar filtro inicial
      filtrarFormaciones();
    }

    // 2. Configurar validación del formulario
    const form = document.getElementById('editInscripcionForm');
    if (form) {
      form.addEventListener('submit', function(e) {
        if (!form.checkValidity()) {
          e.preventDefault();
          e.stopPropagation();
        }
        form.classList.add('was-validated');
      });
    }

    // 3. Configurar envío AJAX con las alertas originales
    if (form) {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const submitBtn = form.querySelector('button[type="submit"]');
        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Guardando...';
        }

        try {
          const formData = new FormData(form);
          const response = await fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: { 
              'X-Requested-With': 'XMLHttpRequest',
              'X-CSRFToken': '{{ csrf_token }}'
            }
          });

          const data = await response.json();
          
          if (data.success) {
            // Alerta original de éxito
            await Swal.fire({
              icon: 'success',
              title: '¡Actualizado!',
              text: data.message,
              confirmButtonText: 'OK',
              customClass: { confirmButton: 'btn btn-success' }
            });
            
            // Cerrar modal si está en uno
            if (typeof $ !== 'undefined' && $('#editInscripcionModal').length) {
              $('#editInscripcionModal').modal('hide');
            }
            window.location.reload();
          } else {
            // Manejo mejorado de errores
            let errorMessage = 'Error al guardar los cambios';
            
            // Manejo específico del error de cuotas
            if (data.errors && data.errors.__all__) {
              errorMessage = data.errors.__all__.message;
            } 
            // Manejo de errores generales
            else if (data.errors) {
              errorMessage = '';
              for (const field in data.errors) {
                errorMessage += data.errors[field].join('\n') + '\n';
              }
            }
            
            // Alerta original de error
            Swal.fire({
              icon: 'error',
              title: 'Error',
              text: errorMessage,
              confirmButtonText: 'OK',
              customClass: { confirmButton: 'btn btn-danger' }
            });
          }
        } catch (error) {
          console.error('Error:', error);
          // Alerta original para errores de red
          Swal.fire({
            icon: 'error',
            title: 'Error',
            text: 'Error de conexión con el servidor',
            confirmButtonText: 'OK',
            customClass: { confirmButton: 'btn btn-danger' }
          });
        } finally {
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Guardar';
          }
        }
      });
    }
  }

  // Inicializar cuando el documento esté listo
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initEditInscripcion);
  } else {
    initEditInscripcion();
  }
</script>
{% endblock %}
