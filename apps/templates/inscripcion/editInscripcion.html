{% load static %}

{% block stylesheets %}
<link rel="stylesheet" href="{% static 'assets/css/styleForms.css' %}" />
<link rel="stylesheet" href="{% static 'assets/css/argon.css' %}" />
{% endblock %}

{% block content %}
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}

  <h2 class="text-center text-dark" style="margin:0 auto; padding:5px 0 15px;">
    Modificar Inscripción
  </h2>

  <form id="editInscripcionForm"
        method="POST"
        action="{% url 'edit_inscripcion' inscripcion.idInscripcion %}"
        class="mt-3 text-dark"
        autocomplete="off"
        style="font-weight:bold; max-width:600px; margin:0 auto;">

    {% csrf_token %}

    <div class="form-row">
      <!-- CÉDULA (DESHABILITADA) -->
      <div class="form-group col-md-6">
        <label for="cedulaPersona">Cédula del Cliente:</label>
        <div class="input-group">
          <input type="text"
                 id="cedulaPersona"
                 class="form-control text-dark"
                 value="{{ inscripcion.idPersona.cedula }}"
                 disabled>
          <!-- hidden para enviar la cédula -->
          <input type="hidden"
                 name="cedulaPersona"
                 value="{{ inscripcion.idPersona.cedula }}">
          <!-- hidden para enviar el idPersona -->
          <input type="hidden"
                 id="idPersona"
                 name="idPersona"
                 value="{{ inscripcion.idPersona.idPersona }}">
        </div>
      </div>

      <!-- MATERIA -->
      <div class="form-group col-md-6">
        <label for="idMateria">Materia:</label>
        <select id="idMateria"
                name="idMateria"
                class="form-control text-dark"
                required>
          <option value="" disabled>Seleccione..</option>
          {% for materia in materias %}
          <option value="{{ materia.idMateria }}"
             {% if materia.idMateria == inscripcion.idMateria.idMateria %}
                selected
             {% endif %}>
            {{ materia.nombreMateria }}
          </option>
          {% endfor %}
        </select>
      </div>

      <!-- COHORTE (DESHABILITADA) -->
      <div class="form-group col-md-6">
        <label for="nombreCohorte">Cohorte:</label>
        <div class="input-group">
          <input type="text"
                 id="nombreCohorte"
                 class="form-control text-dark"
                 value="{{ inscripcion.idCohorte.nombreCohorte }}"
                 disabled>
          <!-- hidden para enviar el nombre y el id -->
          <input type="hidden"
                 name="nombreCohorte"
                 value="{{ inscripcion.idCohorte.nombreCohorte }}">
          <input type="hidden"
                 id="idCohorte"
                 name="idCohorte"
                 value="{{ inscripcion.idCohorte.idCohorte }}">
        </div>
      </div>

      <!-- TIPO FORMACIÓN -->
      <div class="form-group col-md-6">
        <label for="idTF">Tipo de Formación:</label>
        <select id="idTF"
                name="idTF"
                class="form-control text-dark"
                required>
          <option value="" disabled>Seleccione..</option>
          {% for tipo in tipos_formacion %}
          <option value="{{ tipo.idTF }}"
             {% if tipo.idTF == inscripcion.idTF.idTF %}
                selected
             {% endif %}>
            {{ tipo.nombreTipoFormacion }}
          </option>
          {% endfor %}
        </select>
      </div>

      <!-- FORMACIÓN -->
      <div class="form-group col-md-6">
        <label for="idFormacion">Formación Académica:</label>
        <select id="idFormacion"
                name="idFormacion"
                class="form-control text-dark"
                required>
          <option value="" disabled>Seleccione..</option>
          {% for formacion in formaciones %}
          <option value="{{ formacion.idFormacion }}"
             {% if formacion.idFormacion == inscripcion.idFormacion.idFormacion %}
                selected
             {% endif %}>
            {{ formacion.nombreFormacion }}
          </option>
          {% endfor %}
        </select>
      </div>
    </div> <!-- .form-row -->

    <div class="text-center mt-4">
      <button type="submit" class="btn btn-warning">Guardar</button>
    </div>
  </form>
{% endblock %}

{% block javascripts %}
<script src="{% static 'assets/js/sweetalert2@11.js' %}"></script>
<script>
document.getElementById("editInscripcionForm").addEventListener("submit", function(e){
  e.preventDefault();
  const form = e.target, data = new FormData(form);
  fetch(form.action, {
    method: "POST",
    body: data,
    headers: { "X-Requested-With": "XMLHttpRequest" }
  })
  .then(res=>res.json())
  .then(json=>{
    if(json.success){
      Swal.fire({
        icon: "success",
        title: "Actualizado",
        text: json.message,
        confirmButtonText: "OK",
        customClass: { confirmButton: "btn btn-warning" },
        buttonsStyling: false
      }).then(()=> location.reload());
    } else {
      Swal.fire({
        icon: "error",
        title: "Errores",
        html: Object.values(json.errors)
                     .map(err=>`<p>${err}</p>`).join("")
      });
    }
  })
  .catch(()=>{
    Swal.fire("Error","Ocurrió un error inesperado","error");
  });
});
</script>
{% endblock %}
